# ─────────────────────────────────────────────────────────────
# GitHub Pages ya no publica la aplicación: sólo una redirección
# a Cloudflare Pages, que es donde vive ahora.
#
# ── Por qué no se borra y ya ──────────────────────────────────
# Todas las minutas que se enviaron por correo llevan un enlace a
# `agustin-calcuta.github.io/harvey-os/#/reuniones/<id>`. Apagar esta
# dirección deja muertos esos enlaces: quien busque una reunión de
# hace un mes se encuentra con un 404 y no tiene forma de saber a
# dónde se mudó.
#
# La redirección conserva el `#/reuniones/<id>`, así que un correo
# viejo sigue abriendo exactamente la reunión que abría antes.
#
# Cuando ya no queden correos viejos dando vueltas —seis meses, un
# año— este archivo se borra y listo.
#
# La aplicación se compila en `deploy-imporbamas-cloudflare.yml`.
# ─────────────────────────────────────────────────────────────
name: Redirección de la dirección vieja de Imporbamas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar la página de redirección
        run: |
          mkdir -p sitio
          cat > sitio/index.html <<'HTML'
          <!doctype html>
          <html lang="es-AR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="robots" content="noindex" />
              <title>Imporbamas — Reuniones y minutas</title>
              <script>
                // Se conserva el hash: un enlace viejo a
                // `#/reuniones/<id>` sigue abriendo esa misma reunión.
                var destino = 'https://imporbamas-reuniones.pages.dev/' + (location.hash || '')
                location.replace(destino)
              </script>
              <style>
                body {
                  font-family: system-ui, sans-serif;
                  display: grid;
                  place-items: center;
                  min-height: 100vh;
                  margin: 0;
                  background: #f7f5f1;
                  color: #14120f;
                  text-align: center;
                  padding: 24px;
                }
                a { color: #c0392b }
              </style>
            </head>
            <body>
              <div>
                <p>Esta dirección cambió.</p>
                <p>
                  <a id="ir" href="https://imporbamas-reuniones.pages.dev/">
                    Ir a la nueva
                  </a>
                </p>
              </div>
              <script>
                // Por si el navegador no siguió el `replace`.
                document.getElementById('ir').href =
                  'https://imporbamas-reuniones.pages.dev/' + (location.hash || '')
              </script>
            </body>
          </html>
          HTML
          touch sitio/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
